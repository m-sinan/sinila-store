<!doctype html><html><head><meta charset="utf-8"><title>Track · Sinila</title><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{--bg:#FFFFFF;--ink:#1B2320;--muted:#5C6760;--soft:#F2F4F1;--line:#ECEFEA;--green:#4D6B45;--mid:#C9CFC6;--demo-bg:#FFF1C9;--demo-ink:#5E4500;--err:#B3261E;--gut:max(16px,env(safe-area-inset-left,0px))}
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101512;--ink:#EEF2EC;--muted:#A4AEA6;--soft:#18201B;--line:#26302A;--green:#9CC28F;--mid:#3A4A3D;--demo-bg:#3B3213;--demo-ink:#F1D98A;--err:#FF9C92}}
  :root[data-theme="dark"]{--bg:#101512;--ink:#EEF2EC;--muted:#A4AEA6;--soft:#18201B;--line:#26302A;--green:#9CC28F;--mid:#3A4A3D;--demo-bg:#3B3213;--demo-ink:#F1D98A;--err:#FF9C92}
  *{box-sizing:border-box}[hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Inter,Segoe UI,Arial,sans-serif;overflow-x:hidden}
  a{color:var(--green)} button,input{font-family:inherit}
  h1,h2{margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.15}
  h1{font-size:1.6rem} h2{font-size:1.1rem}
  .wrap{padding-inline:var(--gut);max-width:720px;margin:0 auto}
  .eb{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--green)}
  .muted{color:var(--muted)}
  .demo{background:var(--demo-bg);color:var(--demo-ink);font-size:12px;text-align:center;padding:8px var(--gut)}
  .pill{display:inline-block;background:var(--demo-bg);color:var(--demo-ink);font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px}
  .top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
  .top .in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:60px;padding-inline:var(--gut);max-width:720px;margin:0 auto}
  .logo{font-weight:800;font-size:22px;letter-spacing:-.03em;color:var(--ink);text-decoration:none}
  .top .in>:first-child{justify-self:start}
  .top .in>:last-child{justify-self:end}
  .back{font-size:14px;font-weight:600;color:var(--green);text-decoration:none}
  form{display:grid;gap:12px;margin-top:18px}
  .fl{display:grid;gap:6px;font-size:13px;font-weight:600}
  .fl input{width:100%;min-height:52px;padding:10px 14px;font-size:15px;color:var(--ink);background:var(--bg);border:1.5px solid var(--mid);border-radius:14px}
  .btn{background:var(--ink);color:var(--bg);border:0;border-radius:14px;padding:14px;font-weight:700;font-size:15px;cursor:pointer;min-height:52px}
  .err{color:var(--err);font-weight:600;font-size:14px;min-height:1.3em}
  .steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
  .steps li{position:relative;padding:0 0 22px 30px;color:var(--muted)}
  .steps li::before{content:"";position:absolute;left:7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--line)}
  .steps li::after{content:"";position:absolute;left:12px;top:20px;bottom:0;width:2px;background:var(--line)}
  .steps li:last-child::after{display:none}
  .steps li.done{color:var(--ink)} .steps li.done::before{background:var(--green)} .steps li.done::after{background:var(--green)}
  .steps li.now{color:var(--ink);font-weight:700} .steps li.now::before{background:var(--ink);box-shadow:0 0 0 4px var(--soft)}
  .steps small{display:block;font-weight:400;color:var(--muted);font-size:12px}
  .card{border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
  footer{max-width:720px;margin-left:auto;margin-right:auto;padding:24px var(--gut) 40px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);margin-top:30px}
  .tabs{display:flex;gap:8px;margin-top:16px;background:var(--soft);padding:4px;border-radius:99px}
  .tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:10px;border-radius:99px;font-weight:600;cursor:pointer;font-size:14px}
  .tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
  .simple{list-style:none;margin:6px 0 0;padding:0}
  .simple li{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
  .simple li .l{display:flex;align-items:center;gap:12px}
  .simple li .d{width:12px;height:12px;border-radius:50%;background:var(--green)}
  .simple li.now .d{background:var(--ink)}
  .simple li.todo .d{background:var(--line)}
  .simple li b{font-weight:600}
  .simple li.todo b{color:var(--muted);font-weight:500}
  .simple li .t{color:var(--muted);font-size:13px}
  .simple li.todo .t{color:var(--muted)}
  .info{margin-top:14px;background:var(--soft);border-radius:14px;padding:14px;font-size:13px;color:var(--muted)}
  .info b{color:var(--ink)}
  .info a{color:var(--green);font-weight:600}
  .note{background:var(--soft);border-radius:14px;padding:14px;margin-top:14px;font-size:14px}
  .note b{display:block;margin-bottom:6px}
  .note p{margin:4px 0;color:var(--muted)}
  .loader{display:flex;gap:12px;align-items:center;color:var(--muted);padding:10px 0}
  .spin{width:20px;height:20px;border:2.5px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;flex:0 0 auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .refresh{border:0;background:var(--soft);color:var(--ink);font-weight:600;font-size:13px;padding:8px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .refresh:disabled{opacity:.6;cursor:wait}
  .rate{margin-top:16px;display:grid;gap:8px;font-size:13px;color:var(--muted)}
  .rate div{display:flex;gap:8px}
  .rate button{flex:1;border:1.5px solid var(--mid);background:var(--bg);color:var(--ink);border-radius:12px;padding:10px 6px;font:600 13px Inter,sans-serif;cursor:pointer}
  .rate button[aria-pressed="true"]{border-color:var(--green);background:var(--soft)}
</style>
</head><body>
<div class="demo" id="demoBar" hidden>Demo mode is on. Turn it off before launch.</div>
<header class="top"><div class="in"><a class="back" href="index.html">← Shop</a><a class="logo" href="index.html" id="logo">Sinila</a><span></span></div></header>
<main class="wrap">
  <div style="padding-top:20px"><div class="eb">Track</div><h1 style="margin-top:6px">Track your order or return</h1><p class="muted" style="margin-top:6px">Enter the number from your confirmation message and the phone number you used.</p></div>
  <div class="tabs" role="tablist"><button role="tab" id="tOrder" aria-selected="true" data-t="order">Order</button><button role="tab" id="tRet" aria-selected="false" data-t="return">Return</button></div>
  <form id="form" novalidate>
    <label class="fl"><span id="idLabel">Order number</span><input id="id" placeholder="e.g. SN1234"></label>
    <label class="fl">Phone number<input id="ph" type="tel" inputmode="numeric" maxlength="10" placeholder="10 digit mobile number"></label>
    <div class="err" id="err" role="alert"></div>
    <button class="btn" type="submit" id="go">Track order</button>
  </form>
  <div class="card" id="result" hidden></div>
  <p class="muted" style="margin-top:16px;font-size:13px">No request yet? <a href="policies.html#returns">Report a problem</a></p>
</main>
<footer><div id="copy"></div></footer>
<script src="config.js"></script>
<script>
(function(){
  var S=window.STORE||{}, $=function(s){return document.querySelector(s)};
  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
  var MODE={
    order:{label:'Order number',ph:'e.g. SN1234',btn:'Track order',kind:'Order',
      steps:['Order placed','Confirmed','Packed','Shipped','Delivered'],
      map:{'pending confirmation':0,'confirmed':1,'packed':2,'shipped':3,'delivered':5},
      demo:{status:'Shipped',now:3,trackingNo:'',courier:'',trackingLink:''},
      note:'Keep your phone nearby. The courier may call before delivery.'},
    'return':{label:'Request number',ph:'e.g. RT1234',btn:'Track return',kind:'Request',
      steps:['Requested','Checked','Refund or replacement','Closed'],
      map:{'new':0,'checking':1,'replacement shipped':2,'refund started':2,'closed':4},
      demo:{status:'Refund started',now:2,trackingNo:'',courier:'',trackingLink:''},
      note:'Refund goes to your UPI ID (cash on delivery) or original payment method within 7 working days.'}
  };
  var mode='order', last=null;
  $('#logo').textContent=S.name||'Sinila';
  if(S.demoMode)$('#demoBar').hidden=false;
  $('#copy').textContent='\u00A9 '+new Date().getFullYear()+' '+(S.name||'');
  function setMode(m){
    mode=m; var M=MODE[m];
    ['order','return'].forEach(function(k){document.querySelector('[data-t="'+k+'"]').setAttribute('aria-selected',String(k===m))});
    $('#idLabel').textContent=M.label; $('#id').placeholder=M.ph; $('#go').textContent=M.btn;
    $('#result').hidden=true; $('#err').textContent='';
  }
  function showLoader(){
    var r=$('#result'); r.hidden=false;
    r.innerHTML='<div class="loader"><span class="spin" aria-hidden="true"></span><span>Checking your '+(mode==='return'?'return':'order')+'. This can take a few seconds...</span></div>';
  }
  function render(id,res,m){
    var M=MODE[m], r=$('#result'), html;
    var status, now, extra='', note=M.note, cancelled=false, updated='';
    if(res){
      status=String(res.status||'');
      var key=status.toLowerCase().trim();
      cancelled=key==='cancelled';
      now=(M.map[key]!==undefined)?M.map[key]:0;
      updated=res.updated?'Last updated '+esc(String(res.updated).slice(0,10)):'';
      if(m==='order' && res.trackingNo){
        extra='<div class="info"><b>Courier:</b> '+esc(res.courier||'')+'<br><b>Tracking no:</b> '+esc(res.trackingNo)+(res.trackingLink&&/^https?:\/\//.test(res.trackingLink)?'<br><a href="'+esc(res.trackingLink)+'" target="_blank" rel="noopener">Track on courier site</a>':'')+'</div>';
      }
      if(m==='return' && res.trackingNo){
        extra='<div class="info"><b>Courier:</b> '+esc(res.courier||'')+'<br><b>Tracking no:</b> '+esc(res.trackingNo)+'</div>';
      }
    } else {
      status=M.demo.status; now=M.demo.now;
    }
    var title=cancelled?(m==='order'?'Order cancelled':'Request cancelled'):status;
    var list='';
    if(!cancelled){
      list='<ul class="simple">'+M.steps.map(function(name,i){var c=i<now?'done':i===now?'now':'todo';return '<li class="'+c+'"><span class="l"><span class="d"></span><b>'+esc(name)+'</b></span></li>'}).join('')+'</ul>';
    } else {
      list='<p class="muted" style="margin-top:14px">This '+(m==='order'?'order':'request')+' was cancelled. Message us if you have questions.</p>';
    }
    html=(!res&&S.demoMode?'<span class="pill">Demo</span> ':'')+
      '<div class="rhead"><div><div class="eb">'+M.kind+' '+esc(String(id).replace(/[<>&]/g,''))+'</div><h2 style="margin:6px 0 0">'+esc(title)+'</h2>'+(updated?'<div class="muted" style="font-size:12px;margin-top:4px">'+updated+'</div>':'')+'</div>'+
      '<button type="button" class="refresh" id="refresh">Check again</button></div>'+
      list+(cancelled?'':extra)+(cancelled?'':'<div class="note"><b>Please note</b><p>'+esc(note)+'</p></div>');
    r.innerHTML=html;
    r.scrollIntoView({behavior:'smooth',block:'start'});
    $('#refresh').addEventListener('click',function(){ if(last) lookup(last.mode,last.id,last.phone); });
  }
  function lookup(m,id,phone){
    last={mode:m,id:id,phone:phone};
    try{sessionStorage.setItem('sinila-track',JSON.stringify(last))}catch(e){}
    mode=m; var go=$('#go');
    if(!S.scriptUrl){ render(id,null,m); return; }
    go.disabled=true; showLoader();
    var url=S.scriptUrl+'?action=track&kind='+(m==='return'?'return':'order')+'&id='+encodeURIComponent(id)+'&phone='+encodeURIComponent(phone);
    fetch(url).then(function(x){return x.json()}).then(function(res){
      go.disabled=false;
      if(!res.ok){ $('#result').hidden=true; $('#err').textContent=res.message||'Not found.'; return; }
      $('#err').textContent=''; render(id,res,m);
    }).catch(function(){
      go.disabled=false; $('#result').hidden=true; $('#err').textContent='Could not reach the server. Try again.';
    });
  }
  $('#form').addEventListener('submit',function(ev){
    ev.preventDefault(); var e=$('#err'); e.textContent='';
    var M=MODE[mode], id=$('#id').value.trim(), ph=$('#ph').value.replace(/\D/g,'');
    if(id.length<4)return e.textContent='Please enter your '+M.label.toLowerCase()+'.';
    if(!/^[6-9]\d{9}$/.test(ph))return e.textContent='Please enter the phone number you used.';
    lookup(mode,id,ph);
  });
  document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b)setMode(b.dataset.t)});
  var qp=new URLSearchParams(location.search), t=qp.get('t');
  setMode(t==='return'?'return':'order');
  var saved=null; try{saved=JSON.parse(sessionStorage.getItem('sinila-track')||'null')}catch(e){}
  if(qp.get('id')){
    $('#id').value=qp.get('id'); $('#ph').value=qp.get('phone')||'';
    if(/^[6-9]\d{9}$/.test((qp.get('phone')||'').replace(/\D/g,''))) $('#form').dispatchEvent(new Event('submit',{cancelable:true}));
  } else if(saved){
    setMode(saved.mode); $('#id').value=saved.id; $('#ph').value=saved.phone;
    lookup(saved.mode,saved.id,saved.phone);
  }
})();
</script>
</body></html>
